# Datasource (defaults suitable for running app and DB locally)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agung}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/contact_restful_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

logging.level.com=INFO

app.cors.allowed-origin=http://localhost:8081/
spring.threads.virtual.enabled=true

# ---------- How to override for other environments ----------
# 1) Docker app + MySQL on host (Windows/Mac):
#    Set env var:
#    SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/contact_restful_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#
# 2) Docker Compose (app and DB on same network, service name: mysql):
#    Set env var:
#    SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/contact_restful_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#
# If your MySQL listens on a different port, adjust the port in the URL accordingly.
