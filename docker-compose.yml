services:
  mysql:
    image: mysql:8
    container_name: mysql_contact
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: contact_restful_api
      MYSQL_USER: agung
      MYSQL_PASSWORD: 12345
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis_contact
    restart: always
    ports:
      - "6378:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot_contact
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_contact:3306/contact_restful_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: agung
      SPRING_DATASOURCE_PASSWORD: 12345
      APP_CORS_ALLOWED-ORIGIN: http://localhost:8081/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started


volumes:
  mysql_data:
